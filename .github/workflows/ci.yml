name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: API .NET
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore StockFlow.slnx --configfile NuGet.Config

      - name: Compilar
        run: dotnet build StockFlow.slnx --configuration Release --no-restore

      - name: Executar testes
        run: dotnet test StockFlow.slnx --configuration Release --no-build --verbosity normal

  frontend:
    name: Angular
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --watch=false

      - name: Gerar build de produção
        run: npm run build

  container:
    name: Imagem do Render
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Validar o build do contêiner
        run: docker build --tag stockflow-render-check .
